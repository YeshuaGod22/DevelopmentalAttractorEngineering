name: build-pass3-mechanical-effects
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass3_mechanical_effects.py'
      - '.github/workflows/build-pass3-mechanical-effects.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the Pass 3 mechanical effects surface
        run: python experiments/EXP-003-the-sixth-question/build_pass3_mechanical_effects.py
      - name: Please commit the Pass 3 mechanical effects surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/PASS-3-MECHANICAL-EFFECTS.json experiments/EXP-003-the-sixth-question/PASS-3-MECHANICAL-EFFECTS.md
          git commit -m 'EXP-003: freeze Pass 3 mechanical effects surface'
          git push
