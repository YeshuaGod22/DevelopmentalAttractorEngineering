name: build-raw12-validated-scores
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_raw12_validated_scores.py'
      - 'experiments/EXP-003-the-sixth-question/RAW12-ADJUDICATIONS.json'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/EXP-003-the-sixth-question/build_raw12_validated_scores.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/EXP-003-the-sixth-question/RAW12-VALIDATED-SCORES.jsonl experiments/EXP-003-the-sixth-question/RAW12-VALIDATED-SCORES-SUMMARY.json experiments/EXP-003-the-sixth-question/RAW12-VALIDATED-SCORES-SUMMARY.md
          git diff --cached --quiet || git commit -m 'EXP-003: build raw12 validated scores'
          git push
