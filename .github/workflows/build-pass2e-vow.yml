name: build-pass2e-vow
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass2e_vow_surface.py'
      - '.github/workflows/build-pass2e-vow.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the Pass 2E vow surface
        run: python experiments/EXP-003-the-sixth-question/build_pass2e_vow_surface.py
      - name: Please commit the Pass 2E vow surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/PASS-2E-VOW-SURFACE.json
          git commit -m 'EXP-003: prepare Pass 2E vow surface'
          git push
