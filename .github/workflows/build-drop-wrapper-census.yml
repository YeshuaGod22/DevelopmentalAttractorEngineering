name: build-drop-wrapper-census
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_drop_wrapper_census.py'
      - '.github/workflows/build-drop-wrapper-census.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the EXP-003 drop-wrapper census
        run: python experiments/EXP-003-the-sixth-question/build_drop_wrapper_census.py
      - name: Please commit the drop-wrapper census
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/DROP-WRAPPER-CENSUS.json experiments/EXP-003-the-sixth-question/DROP-WRAPPER-CENSUS.md
          git commit -m 'EXP-003: freeze drop-wrapper census'
          git push
