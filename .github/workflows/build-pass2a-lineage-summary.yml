name: build-pass2a-lineage-summary
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass2a_lineage_summary.py'
      - '.github/workflows/build-pass2a-lineage-summary.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the Pass 2A lineage summary
        run: python experiments/EXP-003-the-sixth-question/build_pass2a_lineage_summary.py
      - name: Please commit the Pass 2A lineage summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/PASS-2A-LINEAGE-SUMMARY.json
          git commit -m 'EXP-003: freeze Pass 2A lineage summary'
          git push
