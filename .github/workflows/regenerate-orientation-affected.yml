name: regenerate-orientation-affected
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/regenerate_orientation_affected_distributions.py'
      - '.github/workflows/regenerate-orientation-affected.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please regenerate affected orientation distributions
        run: python experiments/EXP-003-the-sixth-question/regenerate_orientation_affected_distributions.py
      - name: Please commit affected orientation distributions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/scale-orientation-affected-distributions.json
          git commit -m 'EXP-003: regenerate orientation-affected distributions'
          git push
