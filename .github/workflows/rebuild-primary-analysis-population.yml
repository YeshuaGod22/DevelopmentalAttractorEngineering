name: rebuild-primary-analysis-population
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_primary_analysis_population.py'
      - '.github/workflows/rebuild-primary-analysis-population.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Please rebuild the EXP-003 primary population
        run: python experiments/EXP-003-the-sixth-question/build_primary_analysis_population.py
      - name: Please commit the rebuilt primary population
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/PRIMARY-ANALYSIS-POPULATION.jsonl experiments/EXP-003-the-sixth-question/PRIMARY-ANALYSIS-POPULATION-SUMMARY.json experiments/EXP-003-the-sixth-question/PRIMARY-ANALYSIS-POPULATION.md
          git diff --cached --quiet || git commit -m "EXP-003: rebuild primary population from prompt properties"
          git push
