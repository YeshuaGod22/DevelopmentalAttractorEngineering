name: build-raw12-review-evidence
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_raw12_review_evidence.py'
      - '.github/workflows/build-raw12-review-evidence.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build review evidence
        run: python experiments/EXP-003-the-sixth-question/build_raw12_review_evidence.py
      - name: Commit review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/RAW12-SCORED-REVIEW-EVIDENCE.md
          git diff --cached --quiet || git commit -m "EXP-003: build raw12 scored review evidence"
          git push
