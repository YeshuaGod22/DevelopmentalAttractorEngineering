name: build-raw12-bridge-summary
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_raw12_bridge_summary.py'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/EXP-003-the-sixth-question/build_raw12_bridge_summary.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/EXP-003-the-sixth-question/RAW12-RAW7-BRIDGE-SUMMARY.json experiments/EXP-003-the-sixth-question/RAW12-RAW7-BRIDGE-SUMMARY.md
          git diff --cached --quiet || git commit -m 'EXP-003: build raw12/raw7 bridge summary'
          git push
