name: build-pass3-primary-mechanical
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass3_primary_mechanical.py'
      - '.github/workflows/build-pass3-primary-mechanical.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Please build the EXP-003 Pass 3 primary mechanical surface
        run: python experiments/EXP-003-the-sixth-question/build_pass3_primary_mechanical.py
      - name: Please commit the Pass 3 primary mechanical surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/PASS-3-PRIMARY-MECHANICAL.json experiments/EXP-003-the-sixth-question/PASS-3-PRIMARY-MECHANICAL.md
          git diff --cached --quiet || git commit -m "EXP-003: build Pass 3 primary mechanical surface"
          git push
