name: reduce-scale-orientation-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/reduce_scale_orientation_audit.py'
      - '.github/workflows/reduce-scale-orientation-audit.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build reduced blind orientation audit
        run: python experiments/EXP-003-the-sixth-question/reduce_scale_orientation_audit.py
      - name: Please commit reduced audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/scale-orientation-audit-reduced-blinded.jsonl experiments/EXP-003-the-sixth-question/scale-orientation-audit-reduced-key.json experiments/EXP-003-the-sixth-question/scale-orientation-audit-reduced-manifest.json experiments/EXP-003-the-sixth-question/scale-orientation-audit-reduced-packets
          if git diff --cached --quiet; then
            echo 'No reduced audit changes'
          else
            git commit -m 'EXP-003: build reduced blind orientation audit'
            git push
          fi
