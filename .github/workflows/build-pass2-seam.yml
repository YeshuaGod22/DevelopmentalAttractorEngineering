name: build-pass2-seam
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass2_seam_surface.py'
      - '.github/workflows/build-pass2-seam.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the preregistered seam surface
        run: python experiments/EXP-003-the-sixth-question/build_pass2_seam_surface.py
      - name: Please commit the seam surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/PASS-2-SEAM-SURFACE.json experiments/EXP-003-the-sixth-question/PASS-2-SEAM-SURFACE.md
          git commit -m 'EXP-003: prepare preregistered seam surface'
          git push
