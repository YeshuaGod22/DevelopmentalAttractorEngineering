name: build-item-measurement-table
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_item_measurement_table.py'
      - '.github/workflows/build-item-measurement-table.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the item measurement table
        run: python experiments/EXP-003-the-sixth-question/build_item_measurement_table.py
      - name: Please commit the item measurement table
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/ITEM-MEASUREMENT-TABLE.json experiments/EXP-003-the-sixth-question/ITEM-MEASUREMENT-TABLE.md
          git commit -m 'EXP-003: freeze item measurement table'
          git push
