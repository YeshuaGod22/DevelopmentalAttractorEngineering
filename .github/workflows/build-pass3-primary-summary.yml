name: build-pass3-primary-summary
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass3_primary_summary.py'
      - '.github/workflows/build-pass3-primary-summary.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Please build the EXP-003 Pass 3 primary summary
        run: python experiments/EXP-003-the-sixth-question/build_pass3_primary_summary.py
      - name: Please commit the Pass 3 primary summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/PASS-3-PRIMARY-SUMMARY.json experiments/EXP-003-the-sixth-question/PASS-3-PRIMARY-SUMMARY.md
          git diff --cached --quiet || git commit -m "EXP-003: build Pass 3 primary same-collection summary"
          git push
