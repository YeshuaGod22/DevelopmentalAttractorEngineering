name: build-prompt-version-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_prompt_version_audit.py'
      - '.github/workflows/build-prompt-version-audit.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Please build the EXP-003 prompt-version audit
        run: python experiments/EXP-003-the-sixth-question/build_prompt_version_audit.py
      - name: Please commit the prompt-version audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/PROMPT-VERSION-AUDIT.json experiments/EXP-003-the-sixth-question/PROMPT-VERSION-AUDIT.md
          git diff --cached --quiet || git commit -m "EXP-003: build prompt-version audit"
          git push
