name: build-raw12-scored-review
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_raw12_scored_review.py'
      - '.github/workflows/build-raw12-scored-review.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build compact scored review
        run: python experiments/EXP-003-the-sixth-question/build_raw12_scored_review.py
      - name: Commit review queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/RAW12-SCORED-REVIEW.md
          git diff --cached --quiet || git commit -m "EXP-003: build raw12 scored review"
          git push
