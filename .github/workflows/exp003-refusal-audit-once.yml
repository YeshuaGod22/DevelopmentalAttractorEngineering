name: EXP-003 refusal audit once

on:
  push:
    paths:
      - '.github/workflows/exp003-refusal-audit-once.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build blinded refusal audit
        working-directory: experiments/EXP-003-the-sixth-question
        run: python3 build_refusal_audit.py

      - name: Commit generated audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/refusal-audit-blinded.jsonl \
                  experiments/EXP-003-the-sixth-question/refusal-audit-key.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate EXP-003 blinded refusal audit [skip ci]'
            git push
          fi
