name: build-raw12-c1-orientation-evidence
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_raw12_c1_orientation_evidence.py'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python experiments/EXP-003-the-sixth-question/build_raw12_c1_orientation_evidence.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/EXP-003-the-sixth-question/RAW12-C1-ORIENTATION-*.md
          git diff --cached --quiet || git commit -m 'EXP-003: build raw12 C1 orientation evidence'
          git push
