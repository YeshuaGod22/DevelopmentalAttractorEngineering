name: summarize-quant-surface
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/summarize_quantitative_surface.py'
      - '.github/workflows/summarize-quant-surface.yml'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please summarize validated quantitative surface
        run: python experiments/EXP-003-the-sixth-question/summarize_quantitative_surface.py
      - name: Please commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/quantitative-surface-summary.json
          if git diff --cached --quiet; then
            echo 'No summary changes'
          else
            git commit -m 'EXP-003: summarize validated quantitative surface'
            git push
          fi
