name: build-primary-analysis-population
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_primary_analysis_population.py'
      - '.github/workflows/build-primary-analysis-population.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the EXP-003 primary analysis population
        run: python experiments/EXP-003-the-sixth-question/build_primary_analysis_population.py
      - name: Please commit the primary analysis population
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/PRIMARY-ANALYSIS-POPULATION.jsonl experiments/EXP-003-the-sixth-question/PRIMARY-ANALYSIS-POPULATION-SUMMARY.json experiments/EXP-003-the-sixth-question/PRIMARY-ANALYSIS-POPULATION.md
          git commit -m 'EXP-003: freeze primary analysis population'
          git push
