name: revisit-c-distribution-shapes
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/revisit_c_distribution_shapes.py'
      - '.github/workflows/revisit-c-distribution-shapes.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please revisit C distribution shapes
        run: python experiments/EXP-003-the-sixth-question/revisit_c_distribution_shapes.py
      - name: Please commit C shape sensitivity output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/c-distribution-shapes-orientation-sensitivity.json
          git commit -m 'EXP-003: revisit C distribution shapes after orientation audit'
          git push
