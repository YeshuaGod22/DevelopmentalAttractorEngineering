name: propagate-refusal-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/apply_refusal_audit_overlay.py'
      - 'experiments/EXP-003-the-sixth-question/build_quantitative_checks.py'
      - '.github/workflows/propagate-refusal-audit.yml'
permissions:
  contents: write
jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated overlay
        run: python experiments/EXP-003-the-sixth-question/apply_refusal_audit_overlay.py
      - name: Regenerate quantitative checks
        run: python experiments/EXP-003-the-sixth-question/build_quantitative_checks.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/analysis-table-validated.jsonl experiments/EXP-003-the-sixth-question/analysis-summary-validated.json experiments/EXP-003-the-sixth-question/quantitative-checks.json
          if git diff --cached --quiet; then
            echo 'No propagation changes'
          else
            git commit -m 'EXP-003: propagate validated refusal audit'
            git push
          fi
