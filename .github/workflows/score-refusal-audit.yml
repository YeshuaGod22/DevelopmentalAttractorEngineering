name: score-refusal-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/score_refusal_audit.py'
      - 'experiments/EXP-003-the-sixth-question/refusal-audit-*.json*'
      - '.github/workflows/score-refusal-audit.yml'
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Score frozen blind audit
        run: python experiments/EXP-003-the-sixth-question/score_refusal_audit.py
      - name: Commit score outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/refusal-audit-score.json experiments/EXP-003-the-sixth-question/refusal-audit-score.md
          if git diff --cached --quiet; then
            echo 'No score changes'
          else
            git commit -m 'EXP-003: score frozen refusal audit'
            git push
          fi
