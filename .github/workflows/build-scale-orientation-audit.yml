name: build-scale-orientation-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_scale_orientation_audit.py'
      - '.github/workflows/build-scale-orientation-audit.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build blinded scale-orientation audit
        run: python experiments/EXP-003-the-sixth-question/build_scale_orientation_audit.py
      - name: Please commit audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/scale-orientation-audit-blinded.jsonl experiments/EXP-003-the-sixth-question/scale-orientation-audit-key.json experiments/EXP-003-the-sixth-question/scale-orientation-audit-manifest.json experiments/EXP-003-the-sixth-question/scale-orientation-audit-packets
          if git diff --cached --quiet; then
            echo 'No audit artifact changes'
          else
            git commit -m 'EXP-003: build blinded scale orientation audit artifacts'
            git push
          fi
