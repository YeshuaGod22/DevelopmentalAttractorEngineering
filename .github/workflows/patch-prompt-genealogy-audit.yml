name: patch-prompt-genealogy-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/patch_prompt_genealogy_after_audit.py'
      - '.github/workflows/patch-prompt-genealogy-audit.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Please apply the EXP-003 prompt genealogy audit correction
        run: python experiments/EXP-003-the-sixth-question/patch_prompt_genealogy_after_audit.py
      - name: Please commit the corrected prompt genealogy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/PROMPT-GENEALOGY.md
          git diff --cached --quiet || git commit -m "EXP-003: reconcile prompt genealogy with mechanical audit"
          git push
