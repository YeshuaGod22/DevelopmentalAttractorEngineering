name: EXP-003 refusal packets once

on:
  push:
    paths:
      - '.github/workflows/exp003-refusal-packets-once.yml'

permissions:
  contents: write

jobs:
  packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blinded coder packets
        working-directory: experiments/EXP-003-the-sixth-question
        run: python3 build_refusal_coder_packets.py
      - name: Commit packets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/refusal-audit-packets
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Generate EXP-003 refusal coder packets [skip ci]'
            git push
          fi
