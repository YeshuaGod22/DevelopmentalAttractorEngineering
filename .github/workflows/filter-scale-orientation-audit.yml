name: filter-scale-orientation-audit
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/filter_scale_orientation_audit.py'
      - '.github/workflows/filter-scale-orientation-audit.yml'
permissions:
  contents: write
jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please filter orientation audit to midpoint-straddling items
        run: python experiments/EXP-003-the-sixth-question/filter_scale_orientation_audit.py
      - name: Please commit filtered audit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/scale-orientation-audit-straddle50.jsonl experiments/EXP-003-the-sixth-question/scale-orientation-audit-straddle50-manifest.json experiments/EXP-003-the-sixth-question/scale-orientation-audit-straddle50-packets
          git commit -m 'EXP-003: filter orientation audit to straddle-50 items'
          git push
