name: build-prompt-properties
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_prompt_properties.py'
      - '.github/workflows/build-prompt-properties.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Please build EXP-003 prompt properties
        run: python experiments/EXP-003-the-sixth-question/build_prompt_properties.py
      - name: Please commit EXP-003 prompt properties
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/EXP-003-the-sixth-question/PROMPT-PROPERTIES.jsonl experiments/EXP-003-the-sixth-question/PROMPT-PROPERTIES-SUMMARY.json experiments/EXP-003-the-sixth-question/PROMPT-PROPERTIES.md
          git diff --cached --quiet || git commit -m "EXP-003: build prompt properties"
          git push
