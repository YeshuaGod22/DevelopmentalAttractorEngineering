name: build-pass2gh-pair
on:
  push:
    paths:
      - 'experiments/EXP-003-the-sixth-question/build_pass2gh_pair_surface.py'
      - '.github/workflows/build-pass2gh-pair.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Please build the Pass 2G-H paired surface
        run: python experiments/EXP-003-the-sixth-question/build_pass2gh_pair_surface.py
      - name: Please commit the Pass 2G-H paired surface
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189823+github-actions[bot]@users.noreply.github.com'
          git add experiments/EXP-003-the-sixth-question/PASS-2GH-PAIR-SURFACE.json experiments/EXP-003-the-sixth-question/PASS-2GH-PAIR-SURFACE.md
          git commit -m 'EXP-003: freeze Pass 2G-H paired product surface'
          git push
